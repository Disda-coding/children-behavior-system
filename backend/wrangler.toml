name = "children-behavior-api"
main = "src/index.ts"
compatibility_date = "2024-01-01"

# 环境变量
# 注意：JWT_SECRET 属于机密，严禁明文写入本文件（会进入 git）。
# 请使用以下命令配置：
#   开发环境: echo "your-secret" | wrangler secret put JWT_SECRET --env dev
#   生产环境: echo "your-secret" | wrangler secret put JWT_SECRET --env production
#   本地开发可在 backend/.dev.vars 中设置（该文件已在 .gitignore 中）

# D1 数据库绑定
[[d1_databases]]
binding = "DB"
database_name = "children-behavior-db"
database_id = "4af417e0-0200-4c45-9a7a-3ac73043f4d0"
migrations_dir = "src/db/migrations"

# KV 命名空间（备份数据与上传文件元数据存储；保留历史命名）
[[kv_namespaces]]
binding = "PPT_STORAGE"
id = "1e2883ae4e754433ac3cf960437cbf42"

# 开发环境
[env.dev]
name = "children-behavior-api-dev"

# 生产环境
[env.production]
name = "children-behavior-api-prod"

# 定时任务触发器 - 每天凌晨2点执行自动备份
[triggers]
crons = ["0 2 * * *"]
